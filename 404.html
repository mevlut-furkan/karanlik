<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kayıp Sayfa — Elyrion</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@900&family=Cinzel&family=EB+Garamond:ital@1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;}
  body{display:flex;align-items:center;justify-content:center;text-align:center;color:#f3e3bb;
    font-family:'EB Garamond',serif;
    background:radial-gradient(circle at 50% 36%,rgba(168,51,31,.35),transparent 60%),#120c06;}
  .b{position:fixed;inset:0;box-shadow:inset 0 0 240px rgba(0,0,0,.85);pointer-events:none;}
  .c{position:relative;padding:30px;max-width:620px;}
  .pre{font-family:'IM Fell English SC',serif;letter-spacing:5px;text-transform:uppercase;color:#b89b54;font-size:14px;}
  h1{font-family:'Cinzel Decorative',serif;font-size:clamp(56px,16vw,140px);margin:6px 0 0;color:#a8331f;text-shadow:0 0 50px rgba(168,51,31,.5);}
  p{font-style:italic;font-size:20px;color:#d9c8a4;}
  a{display:inline-block;margin-top:18px;text-decoration:none;color:#f3e3bb;font-family:'IM Fell English SC',serif;
    letter-spacing:2px;text-transform:uppercase;font-size:15px;padding:13px 30px;border:1px solid #b89b54;border-radius:40px;transition:.25s;}
  a:hover{background:rgba(140,28,19,.45);border-color:#f0d79a;box-shadow:0 0 26px rgba(168,51,31,.5);}
</style>
</head>
<body>
<div class="b"></div>
<div class="c">
  <div class="pre">Karanlık Doğuş'un Yankıları</div>
  <h1>404</h1>
  <p>Aradığın sayfa kraterin içinde kaybolmuş gibi görünüyor. Yolu kaybeden tek sen değilsin.</p>
  <a href="./">◄ Kapağa Dön</a>
</div>
</body>
</html>
